[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[project]
name = "changescope"
version = "0.1.0"
description = "Local-first explainable impact analysis for legacy codebases"
requires-python = ">=3.10"
dependencies = [
  "tree-sitter==0.25.2",
  "tree-sitter-java==0.23.5",
]

[project.scripts]
changescope = "changescope.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
